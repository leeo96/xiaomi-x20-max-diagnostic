plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leeo96.x20diagnostic'
    compileSdk 35

    defaultConfig {
        applicationId "com.leeo96.x20diagnostic"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
